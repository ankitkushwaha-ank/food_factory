services:
  - type: web
    name: food_factory
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn food_factory.wsgi:application
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: IITP_copanion_plus.settings
